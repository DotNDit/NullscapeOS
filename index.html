<!DOCTYPE html>
<html>

  <head>

    <!--<script type="module" src="script.js"></script>-->

    <link rel="stylesheet" href="./style.css" />


  </head>
  

  <body class="background">

    <div class="app-container" id="appcontainer">

      <div class="welcome-open" id="welcomeopen" >

        <img class="welcome-app" src="./images/mart_guy.jpg">
        <p class="welcome-app-name">Welcome</p>

      </div>
      
      <div class="notes-open" id="notesopen">

        <img class="notes-app" src="./images/ponderer.png">
        <p class="notes-app-name">Notes</p>

      </div>

    </div>

    <!-- ||||||| -->
    <!-- Welcome -->
    <!-- ||||||| -->

    <div class="welcome-window" id="welcomewindow">
      
      <div class="welcome-header" id="welcomeheader">

        <div class="welcome-close" id="welcomeclose">

          <p style="color: black;">x</p>

        </div>

        <div class="welcome-hide" id="welcomehide">

          <p style="color: black;">─</p>

        </div>

      </div>

      <div class="welcome-content">  

        <h1><span class="welcome-title">Welcome!</span></h1>

        <h2 class="welcome-subtitle">Hello and Welcome to Nullscape OS!</h2>

        <p class="welcome-text">
          Nullscape OS is a web broswer based Operating System themed around the game, Roblox Nullscape!
          Consider checking the game out in your free time!
        </p>

        <img class="welcome-image" src="./images/Mart Approved.jpg">

      </div>

    </div>

    <!-- ||||||| -->
    <!--  Notes  -->
    <!-- ||||||| -->

    <div class="notes-window" id="noteswindow">
      
      <div class="notes-header" id="notesheader">

        <div class="notes-close" id="notesclose">

          <p style="color: black;">x</p>

        </div>

        <div class="notes-hide" id="noteshide">

          <p style="color: black;">─</p>

        </div>

      </div>

      <div class="notes-container">

        <div class="notes-content" id="notescontent"></div>

        <div class="note-tab">

          <div class="side-bar" id="sidebar"></div>
          <div class="add-note" id="addnote"><p style="font-size: 40px; color: white; user-select: none;">+</p></div>

        </div>

      </div>

    </div>

    <div class="time-container">

      <div class="time">

        <p class="time-element" id="timeElement">

          <span id="timePart"></span>
          <br>
          <span id="datePart"></span>

        </p>
      
      </div>

    </div>

    <div class="change-background" id="changebackground">
      
      <p>

        Change background

      </p>

    </div>

    <script src="./script.js"></script>

  </body>

</html>
